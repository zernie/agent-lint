<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PROMISE = all three instruments, not just the grade. The site's first
         contact (tab, OG card, tweet card) used to say only "Lighthouse", so a
         reader learned vigiles graded things and never learned it also RUNS them
         against a scripted model and MEASURES whether a skill fires. The
         Lighthouse analogy is still true of `audit` and still appears where it
         belongs (the verb map, the README FAQ) — it just isn't the whole promise. -->
    <title>vigiles — audit, test and measure your agent harness</title>
    <meta
      name="description"
      content="Your skills, hooks, and subagents are code now. vigiles grades them, runs them against a scripted model, and measures whether they actually fire. Start with npx vigiles audit."
    />
    <meta
      property="og:title"
      content="vigiles — audit, test and measure your agent harness"
    />
    <meta
      property="og:description"
      content="Your skills, hooks, and subagents are code now. vigiles grades them, runs them against a scripted model, and measures whether they actually fire."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vigiles" />
    <!-- Self-referencing canonical. The same build is served from TWO hosts —
         https://vigiles.sh/ (CNAME) and https://zernie.github.io/vigiles/ — so
         without this Google picks the canonical itself and may consolidate onto
         the github.io copy. The generated /checks/<slug>/ pages already carry one
         (site/scripts/gen-check-pages.ts); the landing was the gap. -->
    <link rel="canonical" href="https://vigiles.sh/" />
    <meta property="og:url" content="https://vigiles.sh/" />
    <!-- Absolute URL is required: OG crawlers can't resolve a relative path. -->
    <meta property="og:image" content="https://vigiles.sh/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="vigiles — audit, test and measure your agent harness. A report card grading Truthfulness, Triggering, Structure, Safety and Tested."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="vigiles — audit, test and measure your agent harness"
    />
    <meta
      name="twitter:description"
      content="Your skills, hooks, and subagents are code now. vigiles grades them, runs them against a scripted model, and measures whether they actually fire."
    />
    <meta name="twitter:image" content="https://vigiles.sh/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
