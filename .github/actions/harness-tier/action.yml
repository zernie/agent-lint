name: "vigiles harness tier"
description: >
  Run one vigiles test tier with exactly the capabilities it needs. unit needs
  nothing; integration adds bubblewrap + the claude CLI (no API key);
  e2e additionally sets up rootless egress (pasta/slirp4netns + nftables). Mirrors
  the tiered import paths vigiles/unit · /integration · /e2e and the vitest
  projects. Usage from any repo:
  `- uses: zernie/vigiles/.github/actions/harness-tier@main` with `tier: e2e`.

inputs:
  tier:
    description: "Which tier to run: unit | integration | e2e."
    required: true
  node-version:
    description: "Node.js version."
    required: false
    default: "20"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci

    # integration + e2e run real hooks under bubblewrap and drive the claude CLI
    # against a scripted mock model (no API key). Ubuntu 24.04 locks unprivileged
    # user namespaces behind AppArmor; unlock so bwrap can create them.
    - name: Set up bubblewrap + claude CLI
      if: ${{ inputs.tier == 'integration' || inputs.tier == 'e2e' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        npm i -g @anthropic-ai/claude-code
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    # e2e exercises allowlisted REAL egress. pasta (passt) is the routable rootless
    # connector (Podman's default; doesn't need the slirp4netns tap-attach that
    # fails on hosted runners — see research/egress-sandbox-tooling.md); slirp4netns
    # is the fallback, nftables is the allowlist wall. Tests that still can't route
    # self-skip via egressRoutes() rather than fail.
    - name: Set up rootless egress (pasta / slirp4netns / nft)
      if: ${{ inputs.tier == 'e2e' }}
      shell: bash
      run: |
        sudo apt-get install -y passt slirp4netns nftables \
          || sudo apt-get install -y slirp4netns nftables

    - name: Run the ${{ inputs.tier }} tier
      shell: bash
      run: npm run test:${{ inputs.tier }}
