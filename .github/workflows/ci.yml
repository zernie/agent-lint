name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # JVM/Go linter pins for the gated real-binary catalog tests
      # (src/core/linters.test.ts — describe.skipIf(!hasBinary(...))). Installing
      # these makes those tests RUN in CI instead of silently skipping forever
      # (a green-with-skips is a hidden gap — no-silent-skips). detekt is pinned
      # to the latest STABLE (2.0 is still alpha).
      DETEKT_VERSION: "1.23.8"
      KTLINT_VERSION: "1.8.0"
      CHECKSTYLE_VERSION: "13.8.0" # 13.x requires JDK >= 17
      GOLANGCI_LINT_VERSION: "2.12.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # One JDK serves detekt + ktlint + checkstyle. Temurin 21 is preinstalled
      # on ubuntu-24.04 runners, so this is env setup (~seconds), not a download.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-ruff-pylint

      - name: Cache gem packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/gem
          key: gem-${{ runner.os }}-rubocop

      - name: Cache JVM/Go linter tools
        uses: actions/cache@v4
        with:
          path: ~/.vigiles-linter-tools
          key: linter-tools-${{ runner.os }}-detekt${{ env.DETEKT_VERSION }}-ktlint${{ env.KTLINT_VERSION }}-checkstyle${{ env.CHECKSTYLE_VERSION }}-golangci${{ env.GOLANGCI_LINT_VERSION }}

      - run: npm ci

      - name: Install linter CLIs for tests
        run: |
          pip install ruff pylint
          gem install rubocop
          rustup component add clippy

      - name: Install JVM/Go linter CLIs (detekt, ktlint, checkstyle, golangci-lint)
        # Lets the gated real-binary catalog tests in src/core/linters.test.ts
        # actually RUN instead of skipping. Each tool must land on PATH under the
        # exact name its LINTERS adapter's `cliTool` expects (src/core/linters.ts):
        # detekt, ktlint, checkstyle, golangci-lint. checkstyle ships only a fat jar,
        # so it gets a 2-line `java -jar` shim; detekt's zip launcher is symlinked.
        run: |
          TOOLS="$HOME/.vigiles-linter-tools"
          BIN="$TOOLS/bin"
          mkdir -p "$BIN"
          if [ ! -x "$BIN/detekt" ]; then
            curl -sSfL -o /tmp/detekt-cli.zip \
              "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
            unzip -q -o /tmp/detekt-cli.zip -d "$TOOLS"
            launcher=$(find "$TOOLS/detekt-cli-${DETEKT_VERSION}/bin" -maxdepth 1 -type f ! -name '*.bat' | head -n1)
            [ -n "$launcher" ] || { echo "detekt launcher not found in zip"; exit 1; }
            chmod +x "$launcher" && ln -sf "$launcher" "$BIN/detekt"

            curl -sSfL -o "$BIN/ktlint" \
              "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
            chmod +x "$BIN/ktlint"

            curl -sSfL -o "$TOOLS/checkstyle-all.jar" \
              "https://github.com/checkstyle/checkstyle/releases/download/checkstyle-${CHECKSTYLE_VERSION}/checkstyle-${CHECKSTYLE_VERSION}-all.jar"
            printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$TOOLS/checkstyle-all.jar" > "$BIN/checkstyle"
            chmod +x "$BIN/checkstyle"

            curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/v${GOLANGCI_LINT_VERSION}/install.sh" \
              | sh -s -- -b "$BIN" "v${GOLANGCI_LINT_VERSION}"
          fi
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Verify linter tools resolve (no silent skips)
        # hasBinary() gates on `which <name>`; fail FAST here rather than letting
        # the gated catalog tests silently skip (no-silent-skips). If a download
        # shape changes, this step goes red instead of the tests quietly passing.
        run: |
          for t in detekt ktlint checkstyle golangci-lint; do
            command -v "$t" >/dev/null || { echo "MISSING on PATH: $t"; exit 1; }
          done
          detekt --version
          ktlint --version
          checkstyle --version || checkstyle -V
          golangci-lint --version

      - name: Install claude + codex CLIs + bubblewrap (deterministic harness + sandbox tests)
        # claude and codex (no API key needed — both reached via a local mock-model
        # tier) let the binary-gated tests actually RUN instead of skipping: claude
        # for the Anthropic-Messages mock, codex for the OpenAI-Responses mock
        # (src/adapters/codex/mock-model.test.ts drives real codex against it).
        # bubblewrap lets the sandbox confinement test execute and prove egress is
        # blocked, instead of skipping.
        run: |
          # Pin claude-code to the dialect-validated version — SINGLE SOURCE OF
          # TRUTH: VALIDATED_CC_VERSION in src/dialect-drift.ts. Keeps the
          # dialect-drift alarm deterministic (fires only on a deliberate bump,
          # not every unpinned CC release on an unrelated PR) and the real-claude
          # harness/eval tests reproducible.
          CC=$(grep -oP -m1 'VALIDATED_CC_VERSION = "\K[0-9.]+' src/dialect-drift.ts)
          [ -n "$CC" ] || { echo "could not read VALIDATED_CC_VERSION"; exit 1; }
          echo "Pinning @anthropic-ai/claude-code@$CC"
          npm i -g "@anthropic-ai/claude-code@$CC" @openai/codex
          sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        # ubuntu-latest (24.04) ships `kernel.apparmor_restrict_unprivileged_userns=1`,
        # which blocks unconfined bubblewrap from creating the namespaces it needs —
        # so `bwrap --unshare-all` fails (EPERM) even though the binary is installed.
        # Disable that restriction so the sandbox confinement tests actually RUN and
        # PASS here (genuine verification), instead of `sandboxAvailable()` correctly
        # detecting it can't confine and skipping them. Best-effort: `|| true` so a
        # future runner without this knob doesn't fail the job (the probe then skips).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Sanity-check that bwrap can now actually namespace:
          bwrap --unshare-all --ro-bind / / true && echo "bwrap confinement: OK" || echo "bwrap confinement: STILL BLOCKED (tests will skip)"

      - name: Build
        run: npm run build

      - name: Run tests + 100% coverage gate (harness-testing pillar)
        run: npm run coverage

      - name: Cross-runner matcher tests (vitest + jest)
        run: npx vitest run && npx jest

      - name: Matcher type augmentation compiles (vitest + jest)
        run: npx tsc --noEmit -p test/types/tsconfig.json

      - name: Type check
        run: npx tsc --noEmit

      # 🔴 site/ and packages/report-view have their OWN tsconfig and were never typechecked here.
      # A field added to the engine's inventory and not to the view's mirror therefore compiled
      # clean through all three steps above and failed only for whoever ran
      # `tsc -p site/tsconfig.json` by hand. That is precisely what happened to `untestedHarness`
      # and `unevaluated` earlier in this PR: three green typecheck steps, none covering the project
      # that broke. A check that passes without covering the thing that broke is the defect this
      # whole PR is about, so it gets a step rather than a note.
      - name: Type check (site + report-view)
        run: npx tsc --noEmit -p site/tsconfig.json

      - name: Check generated types compile
        run: node dist/cli.js generate types && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run fmt:check

  check:
    runs-on: ubuntu-latest
    # pull-requests: write lets the dogfooded action post its sticky PR comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # fetch-depth: 0 so the dogfooded action's capability-diff can reach the
      # PR base commit (it materializes it as a detached worktree).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Build
        run: npm run build

      # Dogfood the shipped GitHub Action FIRST — it's the primary lint gate
      # users actually rely on, so run the composite over the repo's own build
      # (`version: local`) ahead of the redundant direct CLI call below. The
      # action emits per-line `::error file=,line=::` annotations (rendered inline
      # on the PR diff) and posts a sticky PR comment. See the prod-grade-gha-cli
      # rule. Running it first means a lint failure surfaces THROUGH the action
      # (comment + annotations), not a bare CLI step before it. `capability-diff`
      # folds the blast-radius diff vs the PR base into the SAME sticky comment
      # (informational — no fail-on-widen — so a legit widening doesn't red CI).
      - name: Dogfood the vigiles GitHub Action (primary lint gate)
        id: vigiles-action
        uses: ./
        with:
          command: lint
          version: local
          capability-diff: "true"

      - name: Assert the action reported success
        run: |
          got="${{ steps.vigiles-action.outputs.valid }}"
          if [ "$got" != "true" ]; then
            echo "expected the vigiles action output valid=true, got '$got'"
            exit 1
          fi
          echo "vigiles action output: valid=$got"

      - name: Lint compiled files (direct CLI — redundant safety)
        run: node dist/cli.js lint

      # Dogfood the eval staleness gate via the composite Action. This repo's
      # real-model evals run locally (`npm run test:eval`), so no lock is
      # committed yet — `eval-check` is a green no-op here, but it proves the
      # action's `command: eval-check` → `eval --check` path works in CI.
      - name: Dogfood the eval staleness gate (eval-check)
        uses: ./
        with:
          command: eval-check
          version: local
          comment: "false"

      # Public-API surface gate: API Extractor compares the live .d.ts surface of
      # every public entry point against the committed api-surface/*.api.md reports. A PR
      # that adds/removes/changes a public export (or leaks a Claude-Code symbol
      # back onto the agnostic surface) fails here until `npm run api:report` is
      # run and the report diff is reviewed + committed. dist/ is built above.
      - name: API surface gate
        run: node scripts/api-extractor.mjs

      # Smoke-check the API reference GENERATOR (TypeDoc) on every PR — proves
      # `npm run docs:api` / typedoc.json still build, so the api-docs.yml Pages
      # deploy (push to main) can't silently rot. Output is gitignored, not
      # published here.
      - name: API reference generates (smoke, no publish)
        run: npx typedoc

      # Dogfood-corpus guards (deterministic, no model, no key). The benchmark
      # corpus's own correctness-oracle self-checks: a check that stopped
      # discriminating good-from-bad would silently void every downstream
      # benchmark/optimizer claim. See research/dogfood-corpus.md.
      - name: Dogfood corpus guards (bench self-checks)
        run: |
          node bench/corpus/verify.mjs
          node bench/corpus/verify-headroom.mjs

      # The @vigiles/rule-enforcer trust gate — prove the two-stage soundness gate
      # still ABSTAINS the leaky synthesized checkers (its whole reason to
      # exist). gate.js asserts the known-correct kept/abstain verdicts and
      # exits non-zero on drift. Its own package + lockfile, so install in place.
      # Deterministic, no model. See research/dogfood-corpus.md.
      - name: Rule-enforcer trust gate (soundness dogfood)
        run: |
          npm ci --prefix rule-enforcer
          node rule-enforcer/gate.js

  harness:
    # Dogfood the harness-testing pillar on the in-repo build: the deterministic
    # tier runs the real claude CLI against a scripted mock model, so it needs
    # no API key and costs nothing. The eval tier (real model) is run manually
    # via `npm run test:eval`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install claude CLI (pinned to the dialect-validated version; no API key needed)
        run: |
          CC=$(grep -oP -m1 'VALIDATED_CC_VERSION = "\K[0-9.]+' src/dialect-drift.ts)
          [ -n "$CC" ] || { echo "could not read VALIDATED_CC_VERSION"; exit 1; }
          npm i -g "@anthropic-ai/claude-code@$CC"

      - name: Build
        run: npm run build

      - name: Run deterministic harness tests
        run: node dist/cli.js test

  # The in-browser "grade a repo" demo (site/) runs the SAME compiled engine the
  # CLI runs (`@engine/*` → the built dist/), so its browser-mode vitest suite is a
  # real gate: parity (pako === node:zlib on real Chromium), the DemoAudit
  # interaction states, and the idb-keyval grade-cache (real IndexedDB). No API key,
  # deterministic. This closes the gap where demo/engine-parity regressions were
  # only caught locally. The Playwright e2e (`test:e2e`) runs here too — it serves
  # the REAL built bundle and drives it, incl. the 390px mobile-overflow gate that
  # catches layout bleed a component-level test can't (no viewport in @vitest/browser).
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # The site imports the built root dist/ via the @engine/* aliases (the
      # literally-same compiled engine), so it must exist before the browser tests.
      - name: Build engine (root dist/)
        run: npm run build

      - name: Install Chromium for Playwright (vitest browser mode)
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: Run site browser tests (parity + interaction + grade-cache)
        run: npm run test:browser
        working-directory: site

      # Playwright e2e over the real built bundle (serves dist/, network mocked
      # per-test) — the in-frame report/empty states AND the 390px mobile-overflow
      # gate. Chromium is already installed above; the webServer builds engine+site.
      - name: Run site e2e (Playwright — incl. mobile-overflow gate)
        run: npm run test:e2e
        working-directory: site

  # Dogfood the per-level CI action for the e2e tier (allowlisted REAL egress).
  # The egress connector needs /dev/net/tun + privilege to open the tap and
  # configure the netns — the non-root host runner can't, which is why slirp4netns
  # "fails" there (only `lo`). So this job runs as ROOT in a privileged container,
  # where slirp4netns attaches exactly as it does on a root dev box and the egress
  # tests run FOR REAL. Tests still self-skip via egressRoutes() if egress can't
  # route, so the job never fails red. See research/egress-sandbox-tooling.md.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
      options: --privileged --device /dev/net/tun
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/harness-tier
        with:
          tier: e2e
