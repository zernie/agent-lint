name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-ruff-pylint

      - name: Cache gem packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/gem
          key: gem-${{ runner.os }}-rubocop

      - run: npm ci

      - name: Install linter CLIs for tests
        run: |
          pip install ruff pylint
          gem install rubocop
          rustup component add clippy

      - name: Install claude CLI + bubblewrap (deterministic harness + sandbox tests)
        # claude (no API key needed — the mock tier) lets the claude-gated tests
        # run; bubblewrap lets the sandbox confinement test actually execute and
        # prove egress is blocked, instead of skipping.
        run: |
          npm i -g @anthropic-ai/claude-code
          sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        # ubuntu-latest (24.04) ships `kernel.apparmor_restrict_unprivileged_userns=1`,
        # which blocks unconfined bubblewrap from creating the namespaces it needs —
        # so `bwrap --unshare-all` fails (EPERM) even though the binary is installed.
        # Disable that restriction so the sandbox confinement tests actually RUN and
        # PASS here (genuine verification), instead of `sandboxAvailable()` correctly
        # detecting it can't confine and skipping them. Best-effort: `|| true` so a
        # future runner without this knob doesn't fail the job (the probe then skips).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Sanity-check that bwrap can now actually namespace:
          bwrap --unshare-all --ro-bind / / true && echo "bwrap confinement: OK" || echo "bwrap confinement: STILL BLOCKED (tests will skip)"

      - name: Build
        run: npm run build

      - name: Diagnose egress path (slirp4netns NAT) — informational, never fails
        # The two egress-allow e2e tests emit zero packets on the hosted runner
        # while passing locally. Capture WHY before fixing: tool versions, the tun
        # device slirp needs, userns sysctls, and a live probe through the real
        # egress path printing the IN-NETNS resolv.conf / getent / curl / `ip addr`
        # so we can see whether slirp attached (tap0 up), DNS resolved, or NAT routed.
        run: |
          set +e
          echo "== tools =="
          for b in bwrap slirp4netns nft; do printf "%s: " "$b"; command -v "$b" && "$b" --version 2>&1 | head -1; done
          echo "== /dev/net/tun (slirp's tap needs it) =="; ls -l /dev/net/tun 2>&1
          echo "== userns sysctls =="
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1
          sysctl kernel.unprivileged_userns_clone 2>&1
          echo "== host /etc/resolv.conf =="; cat /etc/resolv.conf
          echo "== live egress probe through the real runHook path =="
          node -e 'const {runHook}=require("./dist/run-hook.js"); const r=runHook("echo IN-NETNS; echo --resolv--; cat /etc/resolv.conf; echo --getent--; getent ahosts example.com || echo getent-FAILED; echo --curl--; (curl -sS -m 12 -o /dev/null https://example.com/ && echo curl-OK) || echo curl-FAILED; echo --ip--; ip -o addr 2>/dev/null || echo no-ip", {hook_event_name:"PreToolUse"}, {egress:{allow:["example.com"]}, timeoutMs:30000}); console.log("exitCode:", r.exitCode); console.log("---hook stdout---\n"+r.stdout); console.log("---hook stderr---\n"+r.stderr); console.log("egress:", JSON.stringify(r.egress)); console.log("egressDropped:", JSON.stringify(r.egressDropped));'
          echo "== end diagnostic =="
          exit 0

      - name: Run tests + 100% coverage gate (harness-testing pillar)
        run: npm run coverage

      - name: Cross-runner matcher tests (vitest + jest)
        run: npx vitest run && npx jest

      - name: Matcher type augmentation compiles (vitest + jest)
        run: npx tsc --noEmit -p test/types/tsconfig.json

      - name: Type check
        run: npx tsc --noEmit

      - name: Check generated types compile
        run: node dist/cli.js generate-types && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run fmt:check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Audit compiled files
        run: node dist/cli.js audit

  harness:
    # Dogfood the harness-testing pillar on the in-repo build: the deterministic
    # tier runs the real claude CLI against a scripted mock model, so it needs
    # no API key and costs nothing. The eval tier (real model) is run manually
    # via `npm run test:eval`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install claude CLI (no API key needed for the mock tier)
        run: npm i -g @anthropic-ai/claude-code

      - name: Build
        run: npm run build

      - name: Run deterministic harness tests
        run: node dist/cli.js test
