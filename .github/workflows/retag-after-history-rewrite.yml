name: Retag after history rewrite

# One-off maintenance. research/ was purged from this repository's history on 2026-07-28.
# Every branch was rewritten, but tags still pointed at the old (pre-rewrite) commits and so
# kept the removed content reachable. This re-points each tag at its rewritten equivalent.
# Delete this workflow once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Re-point tags at rewritten commits
        env:
          GH_TOKEN: ${{ github.token }}
