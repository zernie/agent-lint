        run: |
          fail=0; ok=0
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            if gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" \
                 -f sha="$sha" -F force=true >/dev/null 2>&1; then
              ok=$((ok+1))
            else
              echo "FAILED: $tag -> $sha"; fail=$((fail+1))
            fi
          done <<< "$TAGMAP"
          echo "updated=$ok failed=$fail"
          [ "$fail" -eq 0 ]
