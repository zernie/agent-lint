# Landing page (site/) → GitHub Pages.
#
# ⚠️ NOT ENABLED BY DEFAULT — a repo can host only ONE Pages site, and
# `.github/workflows/api-docs.yml` already publishes the TypeDoc API reference to
# Pages (https://zernie.github.io/vigiles/). Enabling this workflow as-is would
# fight api-docs.yml for the same Pages deployment. Enabling it is a deliberate
# routing decision left to a maintainer — see the OPTIONS block below. Until then
# this only runs on manual dispatch and does NOT deploy (build-only), so nothing
# existing breaks.
#
# OPTIONS for going live (pick one, then wire the deploy step):
#   A. Separate host/domain (RECOMMENDED). Deploy the landing to its own host
#      (Vercel/Netlify/Cloudflare Pages) at vigiles.dev, and leave GitHub Pages
#      serving the API docs unchanged. Zero conflict; the CNAME/domain is the only
#      change. `site/` already builds to static output for any static host.
#   B. Landing at Pages root, docs under a subpath. Make THIS workflow the Pages
#      publisher: build `site/` to the root and `npx typedoc` into `./api`, upload
#      the combined tree, and retire/merge api-docs.yml (the docs then live at
#      …github.io/vigiles/api/). Requires updating every link that points at the
#      current docs URL.
#   C. Keep docs at Pages, landing elsewhere — the inverse of B; identical to A in
#      practice.
#
# To actually enable, uncomment the `configure-pages` / `upload-pages-artifact` /
# `deploy-pages` steps below (and reconcile with api-docs.yml per the chosen
# option). The build job below is safe to keep as a CI check that the site
# compiles.

name: Landing site

on:
  workflow_dispatch:

# No Pages permissions here while build-only, so this can never race api-docs.yml.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install site deps
        working-directory: site
        run: npm install

      - name: Build landing site
        working-directory: site
        run: npm run build

      # --- Deploy steps: DISABLED. Uncomment + reconcile with api-docs.yml
      #     (see the OPTIONS block above) to publish to GitHub Pages. ---
      #
      # - uses: actions/configure-pages@v5
      # - uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: site/dist
      # - id: deploy
      #   uses: actions/deploy-pages@v4
