name: API docs

# Publish the generated API reference (TypeDoc → HTML) to GitHub Pages on every
# push to main. Browsable site complementing the hand-written guides in docs/ and
# the committed surface reports in api-surface/*.api.md. TypeDoc config: typedoc.json
# (curated to the public authoring surfaces, public-only, members inline).
#
# REQUIRED ONE-TIME SETUP (repo admin, can't be done from code):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site then publishes at https://zernie.github.io/vigiles/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # TypeDoc reads src/ + tsconfig directly (no dist build needed) and writes
      # api-reference/ as a self-contained HTML site, incl. `.nojekyll` (from
      # githubPages:true) so Pages serves it as-is — no Jekyll/front-matter step.
      - name: Generate API reference (TypeDoc)
        run: npx typedoc

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: api-reference

      - id: deploy
        uses: actions/deploy-pages@v4
