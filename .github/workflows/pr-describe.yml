# Keep the PR DESCRIPTION fresh automatically — the permanent fix for the
# "title/body goes stale as the branch grows" problem (PRs are opened early by
# Claude Code on the web, then accumulate a whole session of commits).
#
# octue/generate-pull-request-description regenerates an auto-managed block
# (between `<!--- START/END AUTOGENERATED NOTES --->` markers it inserts on first
# run) from the branch's Conventional Commits. Any prose you write OUTSIDE the
# markers is left untouched; add `<!--- SKIP AUTOGENERATED NOTES --->` anywhere to
# opt a PR out entirely.
#
# We use octue only to GENERATE the body (read-scoped) and write it back with the
# first-party `gh` CLI (value passed via env var, never interpolated into the
# shell — avoids the GHA script-injection footgun on commit messages), so there's
# one third-party action, not two with write tokens. The TITLE is left to a
# deliberate human/agent choice (it drives semantic-release); `pr-title.yml` still
# validates it. Swap octue for any maintained generator without touching the rest.
name: PR Describe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One run per PR; a newer push supersedes an in-flight update.
concurrency:
  group: pr-describe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  describe:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only GITHUB_TOKEN, so the write would fail — skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: desc
        uses: octue/generate-pull-request-description@1.0.0.beta-2
        with:
          pull_request_url: ${{ github.event.pull_request.url }}
          api_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the regenerated description back to the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed via env (not `${{ }}` in the script) so a crafted commit
          # message can't inject shell.
          NEW_BODY: ${{ steps.desc.outputs.pull_request_description }}
        run: |
          printf '%s' "$NEW_BODY" > /tmp/pr-body.md
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md
